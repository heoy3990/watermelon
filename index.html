<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>유주안 수박 게임</title>

  <style>
    /* ===== 색상 (라이트/다크 모드) ===== */
    :root {
      --bg: #fff6e3;
      --panel: #ffe9b8;
      --ink: #3b2a1a;
      --line: #e0553c;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #2a2118; --panel: #4a3a28; --ink: #fff1d6; }
    }
    :root[data-theme="dark"] { --bg: #2a2118; --panel: #4a3a28; --ink: #fff1d6; }

    /* ===== 기본 ===== */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      touch-action: none;
      user-select: none;
    }
    h1 { font-size: 46px; margin: 0; line-height: 1.1; }
    h2 { font-size: 30px; margin: 0; }
    button {
      font: inherit;
      font-size: 20px;
      padding: 10px 26px;
      border: 0;
      border-radius: 24px;
      background: var(--line);
      color: #fff;
    }
    button.sub { background: var(--panel); color: var(--ink); border: 3px solid var(--ink); }

    /* ===== 게임 화면 ===== */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    #hud {
      width: min(100%, 380px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
    }
    #next-img { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); }
    #board-wrap {
      position: relative;
      width: min(100%, 380px);
      aspect-ratio: 380 / 560;
      max-height: calc(100% - 90px);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--panel);
      border-radius: 14px;
      border: 3px solid var(--ink);
    }
    #game-over {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(40, 25, 10, .78);
      border-radius: 14px;
      color: #fff;
      font-size: 28px;
    }
    #guide { display: flex; gap: 2px; }
    #guide img { width: 22px; height: 22px; border-radius: 50%; }

    /* ===== 전체 화면 (비밀번호 / 로딩 / 타이틀 / 갤러리 / 크게 보기) ===== */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      text-align: center;
      overflow: auto;
      background: var(--bg);
    }
    .screen.on { display: flex; }

    .hero { width: 150px; height: 150px; border-radius: 50%; animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-12px) rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .hero { animation: none; } }

    #loading-bar { width: 220px; height: 14px; border: 3px solid var(--ink); border-radius: 9px; overflow: hidden; }
    #loading-fill { display: block; height: 100%; width: 0; background: var(--line); transition: width .2s; }

    .title-buttons { display: flex; flex-direction: column; gap: 12px; width: 220px; }

    #gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(100%, 380px); }
    #gallery-grid img { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; }
    #viewer-img { width: min(82vw, 340px); height: min(82vw, 340px); border-radius: 50%; }
    #viewer-buttons { display: flex; gap: 12px; align-items: center; }

    /* 비밀번호 키패드 */
    #pin-dots { display: flex; gap: 14px; }
    #pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); }
    #pin-dots i.filled { background: var(--ink); }
    #pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
    #pin-pad button { padding: 0; height: 60px; font-size: 26px; }
    #pin-message { min-height: 24px; color: var(--line); }
    .shake { animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  </style>
</head>

<body>
  <!-- 게임 화면 -->
  <div id="app">
    <div id="hud">
      <button id="home-btn" style="font-size:14px; padding:4px 12px">홈</button>
      <span>점수 <b id="score">0</b></span>
      <span>최고 <b id="best">0</b></span>
      <span style="display:flex; align-items:center; gap:6px">다음 <img id="next-img" alt=""></span>
    </div>
    <div id="board-wrap">
      <canvas id="board" width="760" height="1120"></canvas>
      <div id="game-over">
        <div>게임 오버!</div>
        <div id="final-score"></div>
        <button id="retry-btn">다시 하기</button>
      </div>
    </div>
    <div id="guide"></div>
  </div>

  <!-- 1. 비밀번호 화면 (처음에 보이는 화면) -->
  <div class="screen on" id="pin">
    <h2>비밀번호를 입력하세요</h2>
    <div id="pin-dots"><i></i><i></i><i></i><i></i></div>
    <div id="pin-message"></div>
    <div id="pin-pad"></div>
  </div>

  <!-- 2. 로딩 화면 -->
  <div class="screen" id="loading">
    <img class="hero" id="loading-hero" alt="">
    <div>불러오는 중...</div>
    <div id="loading-bar"><i id="loading-fill"></i></div>
  </div>

  <!-- 3. 타이틀 화면 -->
  <div class="screen" id="title">
    <img class="hero" id="title-hero" alt="">
    <h1>유주안<br>수박 게임</h1>
    <div class="title-buttons">
      <button id="start-btn">게임 시작</button>
      <button class="sub" id="gallery-btn">갤러리</button>
    </div>
  </div>

  <!-- 4. 갤러리 화면 -->
  <div class="screen" id="gallery">
    <h2>갤러리</h2>
    <div id="gallery-grid"></div>
    <button class="sub" id="gallery-back-btn">돌아가기</button>
  </div>

  <!-- 5. 사진 크게 보기 -->
  <div class="screen" id="viewer">
    <img id="viewer-img" alt="">
    <h2 id="viewer-name"></h2>
    <div id="viewer-buttons">
      <button class="sub" id="viewer-prev">이전</button>
      <button class="sub" id="viewer-close">닫기</button>
      <button class="sub" id="viewer-next">다음</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!-- ============================== 게임 코드 ============================== -->
  <script>
    // ---------- 설정값 ----------
    const FRUIT_NAMES  = ['체리', '딸기', '포도', '오렌지', '감', '사과', '배', '복숭아', '파인애플', '멜론', '수박'];
    const FRUIT_RADIUS = [14, 19, 25, 31, 38, 45, 53, 62, 72, 83, 95];  // 단계별 반지름
    const TOP_LEVEL = FRUIT_NAMES.length - 1;   // 가장 큰 과일(수박)의 단계
    const START_LEVELS = 5;                      // 처음 나오는 과일: 체리~감 (0~4단계)

    const BOARD_W = 380;
    const BOARD_H = 560;
    const DEADLINE_Y = 110;          // 이 점선 위로 쌓이면 위험
    const DROP_Y = 40;               // 과일이 떨어지기 시작하는 높이
    const DROP_COOLDOWN_MS = 550;    // 연속으로 떨어뜨리는 최소 간격
    const SETTLE_MS = 1500;          // 떨어진 뒤 이 시간이 지나야 게임 오버 판정 대상
    const GAME_OVER_AFTER_MS = 2000; // 점선 위에 이 시간 머물면 게임 오버
    const LOADING_MIN_MS = 1600;     // 로딩 화면 최소 표시 시간
    const SCREENS = ['pin', 'loading', 'title', 'gallery', 'viewer'];

    // ---------- 비밀번호 ----------
    // 비밀번호 자체는 코드에 없고, 해시값(변환된 값)만 저장되어 있다.
    const PIN_HASH = 'yt0yfpfygg';
    const PIN_LENGTH = 4;

    function hashPin(text) {
      text = 'sk|' + text + '|suika';
      let a = 0xdeadbeef, b = 0x41c6ce57;
      for (let round = 0; round < 3000; round++) {
        for (let i = 0; i < text.length; i++) {
          const c = text.charCodeAt(i);
          a = Math.imul(a ^ c, 2654435761);
          b = Math.imul(b ^ c, 1597334677);
        }
      }
      a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
      b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
      return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
    }

    // ---------- 전역 상태 ----------
    const { Engine, World, Bodies, Events } = Matter;
    const $ = id => document.getElementById(id);

    let canvas, ctx;
    let fruitImages;                 // 그리기용 Image 객체들
    let engine, fruits;              // 물리 엔진, 현재 판 위의 과일들
    let score, bestScore = 0;
    let currentLevel, nextLevel;     // 지금 들고 있는 과일 / 다음 과일
    let aimX, lastDropTime;
    let playing = false, gameOver = false;
    let pin = '';                    // 입력 중인 비밀번호
    let viewerIndex = 0;             // 크게 보기 중인 사진 번호
    let prevFrameTime = performance.now();

    // ---------- 시작 ----------
    window.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      canvas = $('board');
      ctx = canvas.getContext('2d');
      ctx.scale(2, 2);  // 캔버스는 선명하게 2배 해상도

      fruitImages = FRUIT_IMAGES.map(src => {
        const img = new Image();
        img.src = src;
        return img;
      });

      try { bestScore = +localStorage.getItem('suikaBest') || 0; } catch (e) {}
      $('best').textContent = bestScore;

      $('loading-hero').src = FRUIT_IMAGES[0];
      $('title-hero').src = FRUIT_IMAGES[TOP_LEVEL];

      buildGuide();
      buildGallery();
      buildKeypad();
      bindButtons();
      bindBoardInput();
      requestAnimationFrame(gameLoop);
    }

    // ---------- 화면 전환 ----------
    // showScreen('title') → 타이틀만 보임 / showScreen(null) → 게임 판이 보임
    function showScreen(id) {
      SCREENS.forEach(name => $(name).classList.toggle('on', name === id));
      if (id) playing = false;
    }

    function bindButtons() {
      $('start-btn').onclick = startGame;
      $('retry-btn').onclick = startGame;
      $('home-btn').onclick = () => showScreen('title');
      $('gallery-btn').onclick = () => showScreen('gallery');
      $('gallery-back-btn').onclick = () => showScreen('title');
      $('viewer-close').onclick = () => showScreen('gallery');
      $('viewer-prev').onclick = () => openViewer((viewerIndex + TOP_LEVEL) % FRUIT_NAMES.length);
      $('viewer-next').onclick = () => openViewer((viewerIndex + 1) % FRUIT_NAMES.length);
    }

    // ---------- 비밀번호 화면 ----------
    function buildKeypad() {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
      keys.forEach(key => {
        if (!key) { $('pin-pad').appendChild(document.createElement('span')); return; }
        const btn = document.createElement('button');
        btn.textContent = key;
        btn.className = 'sub';
        btn.onclick = () => pressKey(key);
        $('pin-pad').appendChild(btn);
      });
      // 키보드로도 입력 가능
      window.addEventListener('keydown', e => {
        if (/^[0-9]$/.test(e.key)) pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('⌫');
      });
    }

    function pressKey(key) {
      if (!$('pin').classList.contains('on')) return;

      if (key === '⌫') pin = pin.slice(0, -1);
      else if (pin.length < PIN_LENGTH) pin += key;

      updatePinDots();
      $('pin-message').textContent = '';
      if (pin.length < PIN_LENGTH) return;

      if (hashPin(pin) === PIN_HASH) {
        pin = '';
        showScreen('loading');
        runLoading();
      } else {
        $('pin-message').textContent = '비밀번호가 틀렸어요';
        const dots = $('pin-dots');
        dots.classList.remove('shake');
        void dots.offsetWidth;          // 애니메이션 다시 시작하기 위한 트릭
        dots.classList.add('shake');
        pin = '';
        setTimeout(updatePinDots, 250);
      }
    }

    function updatePinDots() {
      document.querySelectorAll('#pin-dots i').forEach((dot, i) => {
        dot.classList.toggle('filled', i < pin.length);
      });
    }

    // ---------- 로딩 화면 ----------
    function runLoading() {
      let loaded = 0;
      const imageJobs = fruitImages.map(img =>
        (img.decode ? img.decode() : Promise.resolve())
          .catch(() => {})
          .then(() => {
            loaded++;
            $('loading-fill').style.width = (loaded / fruitImages.length * 100) + '%';
          })
      );
      const minWait = new Promise(resolve => setTimeout(resolve, LOADING_MIN_MS));
      Promise.all([...imageJobs, minWait]).then(() => showScreen('title'));
    }

    // ---------- 갤러리 ----------
    function buildGallery() {
      FRUIT_IMAGES.forEach((src, i) => {
        const thumb = new Image();
        thumb.src = src;
        thumb.alt = FRUIT_NAMES[i];
        thumb.onclick = () => openViewer(i);
        $('gallery-grid').appendChild(thumb);
      });
    }

    function openViewer(index) {
      viewerIndex = index;
      $('viewer-img').src = FRUIT_IMAGES[index];
      $('viewer-name').textContent = (index + 1) + '. ' + FRUIT_NAMES[index];
      showScreen('viewer');
    }

    // 게임 화면 아래의 "과일 순서" 안내
    function buildGuide() {
      FRUIT_IMAGES.forEach(src => {
        const img = new Image();
        img.src = src;
        $('guide').appendChild(img);
      });
    }

    // ---------- 게임 시작 / 종료 ----------
    function startGame() {
      showScreen(null);
      $('game-over').style.display = 'none';

      engine = Engine.create();
      engine.gravity.y = 1.1;
      fruits = [];
      score = 0;
      aimX = BOARD_W / 2;
      lastDropTime = 0;
      gameOver = false;
      playing = true;
      $('score').textContent = 0;

      // 바닥과 양쪽 벽
      World.add(engine.world, [
        Bodies.rectangle(BOARD_W / 2, BOARD_H + 25, BOARD_W + 100, 50, { isStatic: true }),
        Bodies.rectangle(-25, BOARD_H / 2, 50, BOARD_H * 2, { isStatic: true }),
        Bodies.rectangle(BOARD_W + 25, BOARD_H / 2, 50, BOARD_H * 2, { isStatic: true }),
      ]);
      Events.on(engine, 'collisionStart', onCollision);

      currentLevel = randomStartLevel();
      nextLevel = randomStartLevel();
      $('next-img').src = FRUIT_IMAGES[nextLevel];
    }

    function endGame() {
      gameOver = true;
      $('final-score').textContent = '점수 ' + score;
      $('game-over').style.display = 'flex';
    }

    function randomStartLevel() {
      return Math.floor(Math.random() * START_LEVELS);
    }

    // ---------- 과일 만들기 / 합치기 ----------
    function spawnFruit(level, x, y, isMerged) {
      const body = Bodies.circle(x, y, FRUIT_RADIUS[level] * 0.96, {
        restitution: 0.2,
        friction: 0.1,
        density: 0.0012,
      });
      body.level = level;
      body.bornAt = performance.now();
      body.popEffect = isMerged;      // 합쳐서 생긴 과일은 살짝 커지는 효과
      body.dangerSince = 0;           // 점선 위에 머물기 시작한 시각
      fruits.push(body);
      World.add(engine.world, body);
    }

    function onCollision(event) {
      for (const pair of event.pairs) {
        const a = pair.bodyA, b = pair.bodyB;
        const sameFruit = a.level !== undefined && a.level === b.level;
        if (!sameFruit || a.removed || b.removed) continue;

        mergeFruits(a, b);
      }
    }

    function mergeFruits(a, b) {
      const level = a.level;
      a.removed = b.removed = true;
      World.remove(engine.world, [a, b]);
      fruits = fruits.filter(f => !f.removed);

      if (level === TOP_LEVEL) {
        // 수박 + 수박: 둘 다 터지고 큰 보너스 점수 (새 과일은 없음)
        addScore((level + 1) * (level + 2) / 2 * 5);
      } else {
        const x = (a.position.x + b.position.x) / 2;
        const y = (a.position.y + b.position.y) / 2;
        spawnFruit(level + 1, x, y, true);
        addScore((level + 1) * (level + 2) / 2);
      }
    }

    function addScore(points) {
      score += points;
      $('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        $('best').textContent = bestScore;
        try { localStorage.setItem('suikaBest', bestScore); } catch (e) {}
      }
    }

    // ---------- 입력 ----------
    function bindBoardInput() {
      canvas.addEventListener('pointerdown', updateAim);
      canvas.addEventListener('pointermove', updateAim);
      canvas.addEventListener('pointerup', e => { updateAim(e); dropFruit(); });
    }

    function updateAim(e) {
      const rect = canvas.getBoundingClientRect();
      aimX = (e.clientX - rect.left) / rect.width * BOARD_W;
    }

    // 과일이 벽 밖으로 나가지 않도록 x 위치를 제한
    function clampX(x, level) {
      const r = FRUIT_RADIUS[level];
      return Math.min(BOARD_W - r, Math.max(r, x));
    }

    function dropFruit() {
      const now = performance.now();
      if (gameOver || now - lastDropTime < DROP_COOLDOWN_MS) return;
      lastDropTime = now;

      spawnFruit(currentLevel, clampX(aimX, currentLevel), DROP_Y, false);
      currentLevel = nextLevel;
      nextLevel = randomStartLevel();
      $('next-img').src = FRUIT_IMAGES[nextLevel];
    }

    // ---------- 그리기 ----------
    function drawFrame(now) {
      ctx.clearRect(0, 0, BOARD_W, BOARD_H);

      // 게임 오버 점선
      ctx.strokeStyle = '#e0553c';
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(0, DEADLINE_Y);
      ctx.lineTo(BOARD_W, DEADLINE_Y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 지금 들고 있는 과일과 가이드 선
      if (!gameOver) {
        const x = clampX(aimX, currentLevel);
        const r = FRUIT_RADIUS[currentLevel];
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 1, 50, 2, BOARD_H);
        ctx.globalAlpha = 1;
        ctx.drawImage(fruitImages[currentLevel], x - r, DROP_Y - r, r * 2, r * 2);
      }

      // 판 위의 과일들
      let inDanger = false;
      for (const fruit of fruits) {
        drawFruit(fruit, now);
        if (isAboveDeadline(fruit, now)) inDanger = true;
        if (fruit.dangerSince && now - fruit.dangerSince > GAME_OVER_AFTER_MS && !gameOver) endGame();
      }

      if (inDanger) {
        ctx.fillStyle = 'rgba(224, 85, 60, .12)';
        ctx.fillRect(0, 0, BOARD_W, BOARD_H);
      }
    }

    function drawFruit(fruit, now) {
      const r = FRUIT_RADIUS[fruit.level];
      let scale = 1;
      if (fruit.popEffect) {
        const t = (now - fruit.bornAt) / 180;
        if (t < 1) scale = 0.6 + 0.4 * t + Math.sin(t * Math.PI) * 0.15;
      }
      ctx.save();
      ctx.translate(fruit.position.x, fruit.position.y);
      ctx.rotate(fruit.angle);
      ctx.scale(scale, scale);
      ctx.drawImage(fruitImages[fruit.level], -r, -r, r * 2, r * 2);
      ctx.restore();
    }

    // 과일이 가만히 점선 위에 있는지 확인 (떨어지는 중인 과일은 제외)
    function isAboveDeadline(fruit, now) {
      const r = FRUIT_RADIUS[fruit.level];
      const settled = now - fruit.bornAt > SETTLE_MS;
      const above = fruit.position.y - r < DEADLINE_Y && Math.abs(fruit.velocity.y) < 0.5;
      if (settled && above) {
        fruit.dangerSince = fruit.dangerSince || now;
        return true;
      }
      fruit.dangerSince = 0;
      return false;
    }

    // ---------- 메인 루프 ----------
    function gameLoop(now) {
      const dt = Math.min(32, now - prevFrameTime);
      prevFrameTime = now;
      if (playing) {
        if (!gameOver) Engine.update(engine, dt);
        drawFrame(now);
      }
      requestAnimationFrame(gameLoop);
    }
